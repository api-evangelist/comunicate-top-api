- aid: comunicate-top-api:comunicate-top-api-writing-orders-api
  name: Comunicate.top API Writing orders API
  description: >-
    The API starts no generation. You place an order, we see it, we write it or decline it with a reason,
    and you learn the outcome the same way.


    The reason is simple: a key runs inside a script and can ask for a thousand articles overnight, out
    of quotas that belong to the platform and are shared by every client. And a model-written text delivered
    automatically, seen by nobody here, goes out to publishers under our name.
  humanURL: https://comunicate.top/ro/documentatie-api
  baseURL: https://app.comunicate.top/api/v1
