- aid: comunicate-top-api:comunicate-top-api-public-catalogue-api
  name: Comunicate.top API Public catalogue API
  description: >-
    Four routes that work with no key at all: the network’s niches, one niche with sample publications,
    the catalogue figures and the market statistics. This is the same data the public site shows, served
    as JSON — useful for comparisons, for an assistant that wants to know what is in the network, or for
    anyone who wants to see the shape of the data before opening an account. There is deliberately no
    public route for the full publication list: the inventory is not downloadable in one request.
  humanURL: https://comunicate.top/ro/documentatie-api
  baseURL: https://app.comunicate.top/api/v1
